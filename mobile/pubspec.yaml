name: spikey
description: Spikey - Plugin-first AI coding platform
publish_to: 'none'
version: 0.2.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.0
  go_router: ^13.0.0
  flutter_markdown: ^0.7.3
  flutter_highlight: ^0.7.0
  google_fonts: ^6.1.0
  window_manager: ^0.3.9
  path_provider: ^2.1.1
  path: ^1.9.0
  sqlite3_flutter_libs: ^0.5.0
  sqflite: ^2.3.0
  crypto: ^3.0.3
  uuid: ^4.3.3
  file_selector: ^1.0.0
  google_nav_bar: ^5.0.0
  lucide_icons: ^0.257.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
