name: heides_lens
description: Heides Lens - a viewer and query tool over the HEIDES code nervous system
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.0
  go_router: ^13.0.0
  flutter_highlight: ^0.7.0
  google_fonts: ^6.1.0
  window_manager: ^0.3.9
  path_provider: ^2.1.1
  path: ^1.9.0
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0
  crypto: ^3.0.3
  file_selector: ^1.0.0
  shared_preferences: ^2.2.0
  url_launcher: ^6.2.0
  http: ^1.2.0
  flutter_secure_storage: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
